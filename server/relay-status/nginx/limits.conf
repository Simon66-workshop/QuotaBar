# Include exactly once, directly in http {}, never inside a server {}.
limit_req_zone $binary_remote_addr zone=quotabar_status_ip:1m rate=12r/m;
limit_req_zone $server_name zone=quotabar_status_all:1m rate=60r/m;

# Evaluated by the proxy only after reading the buffered client body.
map "$request_body_file:$request_body" $quotabar_status_body {
    volatile;
    ":" 0;
    default 1;
}

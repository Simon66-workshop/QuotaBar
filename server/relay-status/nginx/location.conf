# Include only in the existing canonical 66workshop.cn HTTPS 443 vhost.
location = /api/relay-status/v1 {
    access_log off;
    error_log /dev/null crit;
    default_type application/json;

    # Reject aliases after nginx URI normalization and body framing at the edge.
    if ($request_uri != "/api/relay-status/v1") { return 400; }
    if ($http_host !~* "^66workshop[.]cn(:443)?$") { return 400; }
    if ($ssl_server_name !~* "^66workshop[.]cn$") { return 400; }
    if ($content_length !~ "^(0)?$") { return 400; }
    if ($http_transfer_encoding != "") { return 400; }

    limit_req zone=quotabar_status_ip burst=4 nodelay;
    limit_req zone=quotabar_status_all burst=10 nodelay;
    limit_req_status 429;
    limit_req_dry_run off;

    proxy_http_version 1.1;
    proxy_pass_request_headers off;
    # Buffer before proxying. Preserve nginx's synthesized Content-Length
    # for lengthless HTTP/2 DATA so the API rejects it even in a separate read.
    # At most one byte can reach the API; nginx rejects larger bodies locally.
    client_max_body_size 1;
    client_body_buffer_size 1k;
    client_body_in_file_only off;
    client_body_timeout 2s;
    proxy_request_buffering on;
    proxy_pass_request_body on;
    proxy_set_header Host 66workshop.cn;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Connection close;
    proxy_cache off;
    proxy_redirect off;
    proxy_connect_timeout 1s;
    proxy_read_timeout 3s;
    proxy_send_timeout 2s;
    proxy_next_upstream off;
    proxy_intercept_errors on;
    error_page 400 413 = @quotabar_status_bad_request;
    error_page 405 = @quotabar_status_method;
    error_page 429 = @quotabar_status_rate_limited;
    error_page 502 504 = @quotabar_status_unavailable;
    proxy_pass http://unix:/run/quotabar-relay-status/api/status.sock:;
}

location @quotabar_status_bad_request {
    access_log off;
    error_log /dev/null crit;
    default_type application/json;
    add_header Cache-Control no-store always;
    return 400 '{"error":"bad_request"}';
}
location @quotabar_status_method {
    access_log off;
    error_log /dev/null crit;
    default_type application/json;
    add_header Cache-Control no-store always;
    add_header Allow GET always;
    return 405 '{"error":"method_not_allowed"}';
}
location @quotabar_status_rate_limited {
    access_log off;
    error_log /dev/null crit;
    default_type application/json;
    add_header Cache-Control no-store always;
    add_header Retry-After 30 always;
    return 429 '{"error":"rate_limited"}';
}
location @quotabar_status_unavailable {
    access_log off;
    error_log /dev/null crit;
    default_type application/json;
    add_header Cache-Control no-store always;
    return 503 '{"error":"service_unavailable"}';
}
